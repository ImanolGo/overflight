[package]
name = "overflight"
version = "0.1.0"
edition = "2024"
description = "See the aircraft flying above you, as a live sky view in your terminal."
repository = "https://github.com/ImanolGo/overflight"
license = "MIT"
readme = "README.md"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
directories = "6"
rand = "0.9"

[dev-dependencies]
insta = "1"
approx = "0.5"

[profile.release]
lto = true
strip = true
